<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f8" />
    <meta name="description" content="A calm, curated library of useful developer resources." />
    <title>Developer Resource Hub</title>
    <script>
      (() => {
        const stored = localStorage.getItem('drh-theme')
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = stored === 'dark' || stored === 'light' ? stored : (systemDark ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
